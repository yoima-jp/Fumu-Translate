      <rect y="0" width="80" height="34" rx="11" fill="#0A5338">
        <animate attributeName="y" dur="6s" repeatCount="indefinite"
          values="0;0;35;69;69;0;0"
          keyTimes="0;0.12;0.50;0.60;0.62;0.68;1"
          calcMode="spline"
          keySplines="0 0 1 1;0.45 0 0.55 1;0.55 0 0.45 1;0.6 0 0.4 1;0.2 0 0.2 1;0 0 1 1"/>
        <animate attributeName="height" dur="6s" repeatCount="indefinite"
          values="34;34;29;22;22;34;34"
          keyTimes="0;0.12;0.50;0.60;0.62;0.68;1"
          calcMode="spline"
          keySplines="0 0 1 1;0.45 0 0.55 1;0.55 0 0.45 1;0.6 0 0.4 1;0.2 0 0.2 1;0 0 1 1"/>
        <animate attributeName="rx" dur="6s" repeatCount="indefinite"
          values="11;11;9;7;7;11;11"
          keyTimes="0;0.12;0.50;0.60;0.62;0.68;1"
          calcMode="spline"
          keySplines="0 0 1 1;0.45 0 0.55 1;0.55 0 0.45 1;0.6 0 0.4 1;0.2 0 0.2 1;0 0 1 1"/>
      </rect>
    </g>
    <g id="mouth">
