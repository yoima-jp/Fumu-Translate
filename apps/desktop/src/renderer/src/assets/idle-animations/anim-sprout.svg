<svg width="806" height="806" viewBox="224 209 806 806" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 待機アニメーション: アホ毛(双葉)ぴくぴく。基準は build/icon.svg。幾何は一切変更せず、根元を支点に揺らす。
       支点は根元(下端)。幾何上わずかに右寄りのため 54% に置く(オンボーディングCSSと同値)。
       双葉が大きく見えるよう、揺れは小刻みな「ぴくぴく」→間→「ぴくぴく」の繰り返し。 -->
  <style>
    .sprout-twitch {
      transform-box: fill-box;
      transform-origin: 54% 100%;
      animation: sprout-twitch 2.4s ease-in-out infinite;
    }
    @keyframes sprout-twitch {
      0%, 46%, 62%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4.5deg); }
      54% { transform: rotate(3.4deg); }
      58% { transform: rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sprout-twitch { animation: none; }
    }
  </style>
  <g class="sprout-twitch" id="sprout">
    <path id="sprout-left" d="M710 346 C696 327 673 293 649 258 C641 246 645 232 657 225 C669 218 684 223 690 236 C708 276 718 313 719 338 C718 342 715 345 710 346Z" fill="#80DF37"/>
    <path id="sprout-center" d="M716 346 C715 314 719 269 728 232 C731 217 744 208 758 211 C772 214 780 227 777 241 C769 283 751 321 730 346 C725 349 720 349 716 346Z" fill="#80DF37"/>
    <path id="sprout-right" d="M724 347 C747 326 784 302 815 288 C828 282 842 287 848 300 C854 313 848 328 835 334 C798 352 758 357 731 354 C727 353 725 350 724 347Z" fill="#80DF37"/>
  </g>
  <g id="body">
    <path id="body-shape" d="M479 341 C397 350 346 382 317 430 C289 477 289 548 289 625 V740 C289 831 294 893 328 938 C364 985 430 1007 523 1011 C575 1014 679 1014 731 1011 C824 1007 890 985 926 938 C960 893 965 831 965 740 V625 C965 548 965 477 937 430 C908 382 857 350 775 341 C687 331 567 331 479 341Z" fill="#75DD35"/>
  </g>
  <g id="eye-left" transform="translate(466 596)">
    <path d="M0 31H80V43 C80 70 63 87 40 87 C17 87 0 70 0 43Z" fill="#FFFFFF"/>
    <rect width="80" height="41" rx="11" fill="#0A5338"/>
  </g>
  <g id="eye-right" transform="translate(701 596)">
    <path d="M0 31H80V43 C80 70 63 87 40 87 C17 87 0 70 0 43Z" fill="#FFFFFF"/>
    <rect width="80" height="41" rx="11" fill="#0A5338"/>
  </g>
  <g id="mouth">
    <rect x="606" y="696" width="36" height="19" rx="9.5" fill="#0A5338"/>
  </g>
</svg>
