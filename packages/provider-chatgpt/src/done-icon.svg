<svg width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradient" x1="627" y1="336" x2="627" y2="1015" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#98EA3D"/>
      <stop offset="0.48" stop-color="#7CDF32"/>
      <stop offset="1" stop-color="#53CF39"/>
    </linearGradient>
    <radialGradient id="bodyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 490) rotate(90) scale(430 500)">
      <stop stop-color="#B7F65E" stop-opacity="0.36"/>
      <stop offset="0.62" stop-color="#8DE83A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#58D438" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mouthClip"><path d="M-30 -6 Q0 42 30 -6 Q0 8 -30 -6Z"/></clipPath>
  </defs>
  <style>
    #bob { animation: hop 4s ease-in-out infinite; transform-origin: 627px 1010px; }
    @keyframes hop {
      0% { transform: translateY(0px) scale(1,1); }
      6% { transform: translateY(0px) scale(1.06,0.9); }
      22% { transform: translateY(-52px) scale(0.95,1.08); }
      36% { transform: translateY(0px) scale(1.05,0.93); }
      44% { transform: translateY(0px) scale(1,1); }
      50% { transform: translateY(0px) scale(1.04,0.94); }
      62% { transform: translateY(-26px) scale(0.97,1.05); }
      72% { transform: translateY(0px) scale(1.03,0.96); }
      82% { transform: translateY(-7px) scale(1,1); }
      92%, 100% { transform: translateY(0px) scale(1,1); }
    }
    #shadow { animation: shDrop 4s ease-in-out infinite; transform-origin: 627px 1007px; }
    @keyframes shDrop {
      0% { transform: scale(1); opacity: 1; }
      6% { transform: scale(0.95); opacity: 0.85; }
      22% { transform: scale(0.76,0.7); opacity: 0.45; }
      36% { transform: scale(0.97); opacity: 0.9; }
      44% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.96); opacity: 0.85; }
      62% { transform: scale(0.87); opacity: 0.65; }
      72% { transform: scale(0.98); opacity: 0.92; }
      82%, 100% { transform: scale(1); opacity: 1; }
    }
    #sprout { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 722px 350px; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    #glow { animation: glowBeat 2s ease-in-out infinite; }
    @keyframes glowBeat { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .eye { animation: eyeJoy 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes eyeJoy {
      0%, 100% { transform: scale(1,1); }
      6% { transform: scale(1.04,0.82); }
      22% { transform: scale(1.06,1.14); }
      36% { transform: scale(1,0.9); }
      50% { transform: scale(1.03,0.85); }
      62% { transform: scale(1.05,1.1); }
      72% { transform: scale(1,0.92); }
      82% { transform: scale(1,1); }
    }
    .mouth { animation: mouthYay 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes mouthYay {
      0%, 100% { transform: scale(1); }
      8% { transform: scale(1.15); }
      22% { transform: scale(1.22); }
      36% { transform: scale(1.02); }
      50% { transform: scale(1.12); }
      62% { transform: scale(1.18); }
      72% { transform: scale(1); }
    }
    .blush { animation: blushBeat 4s ease-in-out infinite; }
    @keyframes blushBeat {
      0% { opacity: 0.5; }
      22% { opacity: 0.85; }
      44% { opacity: 0.5; }
      62% { opacity: 0.8; }
      72%, 100% { opacity: 0.5; }
    }
    .tw { opacity: 0; animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .tw2 { animation-delay: 0.5s; }
    .tw3 { animation-delay: 1s; }
    .tw4 { animation-delay: 1.5s; }
    .tw5 { animation-delay: 2s; }
    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      12% { opacity: 1; transform: scale(1.2) rotate(20deg); }
      20% { opacity: 1; transform: scale(1) rotate(35deg); }
      32%, 100% { opacity: 0; transform: scale(0.2) rotate(60deg); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tw { opacity: 1; } }
  </style>
  <ellipse id="glow" cx="620" cy="490" rx="500" ry="430" fill="url(#bodyGlow)"/>
  <g id="shadow">
