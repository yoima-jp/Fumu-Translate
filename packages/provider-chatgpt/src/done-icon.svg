    <ellipse cx="627" cy="1007" rx="255" ry="17" fill="#74BD56" fill-opacity="0.060"/>
    <ellipse cx="627" cy="1007" rx="185" ry="10" fill="#74BD56" fill-opacity="0.045"/>
