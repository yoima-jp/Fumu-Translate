  <g transform="translate(852 266) scale(1.15)"><path class="tw tw2" d="M0 -13L3.2 -3.2L13 0L3.2 3.2L0 13L-3.2 3.2L-13 0L-3.2 -3.2Z" fill="#FFFFFF"/></g>
  <g transform="translate(472 206) scale(0.8)"><path class="tw tw3" d="M0 -13L3.2 -3.2L13 0L3.2 3.2L0 13L-3.2 3.2L-13 0L-3.2 -3.2Z" fill="#B7F65E"/></g>
  <g transform="translate(912 392) scale(0.9)"><path class="tw tw4" d="M0 -13L3.2 -3.2L13 0L3.2 3.2L0 13L-3.2 3.2L-13 0L-3.2 -3.2Z" fill="#FFD166"/></g>
  <g transform="translate(366 420) scale(0.7)"><path class="tw tw5" d="M0 -13L3.2 -3.2L13 0L3.2 3.2L0 13L-3.2 3.2L-13 0L-3.2 -3.2Z" fill="#FFFFFF"/></g>
