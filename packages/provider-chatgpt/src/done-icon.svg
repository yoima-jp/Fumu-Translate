      <path id="body-highlight" fill="none" d="M479 341 C397 350 346 382 317 430 C289 477 289 548 289 625 V740 C289 831 294 893 328 938 C364 985 430 1007 523 1011 C575 1014 679 1014 731 1011 C824 1007 890 985 926 938 C960 893 965 831 965 740 V625 C965 548 965 477 937 430 C908 382 857 350 775 341 C687 331 567 331 479 341Z"/>
    </g>
    <g transform="translate(466 596)"><g class="eye"><path d="M0 40 Q40 -4 80 40" fill="none" stroke="#0A5338" stroke-width="13" stroke-linecap="round"/></g></g>
    <g transform="translate(701 596)"><g class="eye"><path d="M0 40 Q40 -4 80 40" fill="none" stroke="#0A5338" stroke-width="13" stroke-linecap="round"/></g></g>
    <ellipse class="blush" transform="translate(494 664)" rx="19" ry="9" fill="#FF9BB5"/>
    <ellipse class="blush" transform="translate(752 664)" rx="19" ry="9" fill="#FF9BB5"/>
    <g transform="translate(624 700)"><g class="mouth"><path d="M-30 -6 Q0 42 30 -6 Q0 8 -30 -6Z" fill="#0A5338"/><g clip-path="url(#mouthClip)"><circle cy="22" r="9" fill="#FF97A8"/></g></g></g>
  </g>
